
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | AYAN BIN UMAR</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .product-detail-page {
            max-width: 1100px;
            margin: 60px auto;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .detail-image img {
            width: 100%;
            max-height: 550px;
            object-fit: contain;
            cursor: zoom-in;
            border-radius: 12px;
        }

        .detail-info h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .detail-price {
            font-size: 26px;
            color: #b18a45;
            font-weight: bold;
            margin: 20px 0;
        }

        .detail-description {
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            margin: 20px;
            text-decoration: none;
        }

        .add-to-bag-detail {
            display: inline-block;
            margin: 15px 10px 15px 0;
            cursor: pointer;
            border: none;
        }

        .add-to-bag-detail:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .header-bag {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 10px 16px;
            border: 1px solid #c5a45e;
            color: #e8d5a5;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 38px;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media(max-width: 700px) {
            .product-detail-page {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }

            .detail-info h1 {
                font-size: 25px;
            }

            .header {
                gap: 10px;
            }

            .header-bag {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">AYAN BIN UMAR</a>

        <a href="cart.html" class="header-bag">
            BAG <span id="detailCartCount">0</span>
        </a>

        <a href="index.html" class="btn">BACK TO STORE</a>
    </header>

    <a href="javascript:history.back()" class="back-link">
        ← Back to Collection
    </a>

    <main class="product-detail-page" id="productDetails">
        <p>Loading product details...</p>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="closeLightbox">×</button>
        <img id="lightboxImage" src="" alt="Product image enlarged">
    </div>

    <script type="module">

        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from
            "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

        import {
            showCartPopup
        } from "./cart-popup.js";


        // FIREBASE CONFIGURATION

        const firebaseConfig = {
            apiKey: "AIzaSyDNF25tETO1V208NMwkMsVCQ4caksa_Goo",
            authDomain: "ayan-bin-umar-fabrics.firebaseapp.com",
            projectId: "ayan-bin-umar-fabrics",
            storageBucket: "ayan-bin-umar-fabrics.firebasestorage.app",
            messagingSenderId: "472203328513",
            appId: "1:472203328513:web:3de6e17dc8379431b49400",
            measurementId: "G-5JQ417GF6E"
        };


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById("productDetails");
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");


        // FORMAT PRICE

        const formatPrice = price =>
            "Rs. " + Number(price || 0).toLocaleString("en-PK");


        // SHOPPING BAG

        function getCart() {

            try {
                return JSON.parse(localStorage.getItem("ayanCart")) || {};
            } catch (error) {
                return {};
            }

        }


        function saveCart(cart) {
            localStorage.setItem("ayanCart", JSON.stringify(cart));
        }


        function updateDetailCartCount() {

            const cart = getCart();

            const totalItems = Object.values(cart).reduce(
                (sum, quantity) => sum + Number(quantity || 0),
                0
            );

            document.getElementById("detailCartCount").textContent =
                totalItems;

        }


        // ADD TO BAG

        function addToBag(id, button, product) {

            const cart = getCart();

            cart[id] = (Number(cart[id]) || 0) + 1;

            saveCart(cart);

            const totalItems = Object.values(cart).reduce(
                (sum, quantity) => sum + Number(quantity || 0),
                0
            );

            updateDetailCartCount();

            showCartPopup(
                {
                    name: product.name || "Fabric",
                    price: Number(product.price) || 0,
                    imageUrl: product.imageUrl || ""
                },
                cart[id],
                totalItems
            );

            button.textContent = "ADDED ✓";
            button.disabled = true;

            setTimeout(() => {
                button.textContent = "ADD TO BAG +";
                button.disabled = false;
            }, 1000);

        }


        // LOAD PRODUCT

        async function loadProduct() {

            if (!productId) {
                container.textContent = "Product not found.";
                return;
            }

            try {

                const productRef = doc(db, "products", productId);
                const productSnap = await getDoc(productRef);

                if (!productSnap.exists()) {
                    container.textContent = "Product not found.";
                    return;
                }

                const product = productSnap.data();

                const imageUrl =
                    product.image || product.imageUrl || "";

                const isAvailable =
                    product.status === "available";


                container.innerHTML = `
                    <div class="detail-image">
                        ${
                            imageUrl
                                ? `<img id="mainProductImage" alt="Product image">`
                                : `<p>Image not available</p>`
                        }
                    </div>

                    <div class="detail-info">
                        <h1></h1>
                        <p class="detail-price"></p>
                        <p class="detail-description"></p>
                        <p class="product-status"></p>

                        <button
                            class="btn add-to-bag-detail"
                            id="addToBagButton"
                            ${isAvailable ? "" : "disabled"}
                        >
                            ${isAvailable ? "ADD TO BAG +" : "CURRENTLY UNAVAILABLE"}
                        </button>

                        <a href="index.html#collection" class="btn">
                            CONTINUE SHOPPING
                        </a>
                    </div>
                `;


                container.querySelector("h1").textContent =
                    product.name || "Fabric";

                container.querySelector(".detail-price").textContent =
                    formatPrice(product.price);

                container.querySelector(".detail-description").textContent =
                    product.description || "Premium Quality Fabrics.";

                container.querySelector(".product-status").textContent =
                    isAvailable
                        ? "Available"
                        : "Currently unavailable";


                const addButton =
                    document.getElementById("addToBagButton");


                if (isAvailable) {

                    addButton.addEventListener("click", () => {

                        addToBag(
                            productId,
                            addButton,
                            {
                                name: product.name || "Fabric",
                                price: Number(product.price) || 0,
                                imageUrl: imageUrl
                            }
                        );

                    });

                }


                const mainImage =
                    document.getElementById("mainProductImage");

                if (mainImage) {

                    mainImage.src = imageUrl;

                    mainImage.onerror = () => {
                        mainImage.alt = "Image could not be loaded";
                    };

                    mainImage.addEventListener("click", () => {

                        document.getElementById("lightboxImage").src =
                            imageUrl;

                        document.getElementById("lightbox")
                            .classList.add("active");

                    });

                }


                document.title =
                    (product.name || "Product") + " | AYAN BIN UMAR";


                updateDetailCartCount();

            } catch (error) {

                console.error(error);

                container.textContent =
                    "Could not load product. Please try again.";

            }

        }


        // LIGHTBOX

        document.getElementById("closeLightbox")
            .addEventListener("click", () => {

                document.getElementById("lightbox")
                    .classList.remove("active");

            });


        document.getElementById("lightbox")
            .addEventListener("click", event => {

                if (event.target.id === "lightbox") {
                    event.currentTarget.classList.remove("active");
                }

            });


        // START

        updateDetailCartCount();
        loadProduct();

    </script>

</body>
</html>
