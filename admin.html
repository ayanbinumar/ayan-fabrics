
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAN BIN UMAR | Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #faf8f2;
            color: #123b32;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1, h2 {
            text-align: center;
            color: #123b32;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 2px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus, select:focus {
            outline: 2px solid #d8bb83;
            border-color: #123b32;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #123b32;
            color: white;
            cursor: pointer;
            margin: 5px 3px;
            font-weight: bold;
        }

        button:hover {
            background: #d8bb83;
            color: #123b32;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .danger {
            background: #a33;
        }

        .danger:hover {
            background: #822;
            color: white;
        }

        .product {
            border: 1px solid #ddd;
            padding: 16px;
            margin-top: 14px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .product h3 {
            margin-bottom: 8px;
        }

        .product img,
        #imagePreview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 7px;
            margin: 10px 0;
            display: block;
        }

        #imagePreview {
            display: none;
        }

        #dashboard {
            display: none;
        }

        #message {
            text-align: center;
            margin: 14px 0;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .hint {
            color: #666;
            font-size: 13px;
            margin: 5px 0 12px;
        }

        .section {
            margin-top: 25px;
        }

        .gold-line {
            height: 2px;
            background: #d8bb83;
            margin: 18px 0;
        }

        .category-label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        .category-tag {
            display: inline-block;
            padding: 5px 10px;
            margin: 8px 0;
            background: #f4ead5;
            color: #123b32;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                margin: 10px auto;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AYAN BIN UMAR</h1>
    <h2>ADMIN CONTROL PANEL</h2>

    <div class="gold-line"></div>

    <!-- LOGIN SECTION -->
    <div id="login">

        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginBtn">LOGIN</button>

    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">

        <h2>Manage Products</h2>

        <div class="section">

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
                maxlength="100"
            >

            <input
                type="number"
                id="productPrice"
                placeholder="Product Price (Rs.)"
                min="1"
                step="1"
            >

            <label class="category-label" for="productCategory">
                Select Collection
            </label>

            <select id="productCategory">
                <option value="">Choose Collection</option>
                <option value="men">Men's Collection</option>
                <option value="women">Women's Collection</option>
            </select>

            <input
                type="url"
                id="productImage"
                placeholder="Product Image URL"
            >

            <p class="hint">
                Image ke liye direct image URL paste karein.
            </p>

            <img id="imagePreview" alt="Product preview">

            <button id="saveBtn">ADD PRODUCT</button>

            <button id="cancelBtn" style="display:none;">
                CANCEL EDIT
            </button>

            <button id="logoutBtn">LOGOUT</button>

        </div>

        <p id="message" role="status"></p>

        <div class="gold-line"></div>

        <h2>All Products</h2>

        <div id="productList">
            Loading products...
        </div>

    </div>

</div>

<script type="module">

    // FIREBASE IMPORTS

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // FIREBASE CONFIGURATION

    const firebaseConfig = {
        apiKey: "AIzaSyDNF25tETO1V208NMwkMsVCQ4caksa_Goo",
        authDomain: "ayan-bin-umar-fabrics.firebaseapp.com",
        projectId: "ayan-bin-umar-fabrics",
        storageBucket: "ayan-bin-umar-fabrics.firebasestorage.app",
        messagingSenderId: "472203328513",
        appId: "1:472203328513:web:3de6e17dc8379431b49400",
        measurementId: "G-5JQ417GF6E"
    };


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);


    // HTML ELEMENTS

    const loginBox = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");

    const message = document.getElementById("message");
    const productList = document.getElementById("productList");

    const productName = document.getElementById("productName");
    const productPrice = document.getElementById("productPrice");
    const productCategory = document.getElementById("productCategory");
    const productImage = document.getElementById("productImage");

    const imagePreview = document.getElementById("imagePreview");

    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let editingId = null;


    // MESSAGE FUNCTION

    function showMessage(text, success = false) {
        message.textContent = text;
        message.style.color = success ? "#18733b" : "#a33";
    }


    // LOGIN

    document.getElementById("loginBtn").addEventListener("click", async () => {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("Please enter your email and password.");
            return;
        }

        const loginBtn = document.getElementById("loginBtn");

        loginBtn.disabled = true;
        loginBtn.textContent = "PLEASE WAIT...";

        try {

            await signInWithEmailAndPassword(auth, email, password);

            showMessage("Login successful!", true);

        } catch (error) {

            showMessage("Login failed. Please check your email and password.");

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent = "LOGIN";

        }

    });


    // AUTHENTICATION CHECK

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            loginBox.style.display = "none";
            dashboard.style.display = "block";

            await loadProducts();

        } else {

            loginBox.style.display = "block";
            dashboard.style.display = "none";

            clearForm();

        }

    });


    // IMAGE PREVIEW

    productImage.addEventListener("input", () => {

        const url = productImage.value.trim();

        if (url && /^https?:\/\//i.test(url)) {

            imagePreview.src = url;
            imagePreview.style.display = "block";

        } else {

            imagePreview.removeAttribute("src");
            imagePreview.style.display = "none";

        }

    });

    imagePreview.addEventListener("error", () => {
        imagePreview.style.display = "none";
    });


    // LOAD PRODUCTS

    async function loadProducts() {

        productList.textContent = "Loading products...";

        try {

            const snapshot = await getDocs(collection(db, "products"));

            productList.innerHTML = "";

            if (snapshot.empty) {
                productList.textContent = "No products found.";
                return;
            }

            snapshot.forEach((item) => {

                const product = item.data();

                const card = document.createElement("div");
                card.className = "product";

                const heading = document.createElement("h3");
                heading.textContent = product.name || "Unnamed product";

                const price = document.createElement("p");
                price.textContent = "Price: Rs. " + product.price;

                const category = document.createElement("p");
                category.className = "category-tag";

                if (product.category === "men") {
                    category.textContent = "MEN'S COLLECTION";
                } else if (product.category === "women") {
                    category.textContent = "WOMEN'S COLLECTION";
                } else {
                    category.textContent = "CATEGORY NOT SET";
                }

                card.append(heading, price, category);


                // PRODUCT IMAGE

                if (
                    product.image &&
                    /^https?:\/\//i.test(product.image)
                ) {

                    const img = document.createElement("img");

                    img.src = product.image;
                    img.alt = product.name || "Product";
                    img.loading = "lazy";

                    card.appendChild(img);

                }


                // EDIT BUTTON

                const edit = document.createElement("button");

                edit.textContent = "EDIT";

                edit.addEventListener("click", () => {

                    productName.value = product.name || "";
                    productPrice.value = product.price || "";
                    productCategory.value = product.category || "";
                    productImage.value = product.image || "";

                    editingId = item.id;

                    saveBtn.textContent = "UPDATE PRODUCT";
                    cancelBtn.style.display = "inline-block";

                    if (product.image) {
                        imagePreview.src = product.image;
                        imagePreview.style.display = "block";
                    } else {
                        imagePreview.style.display = "none";
                    }

                    showMessage(
                        "Editing product: " + (product.name || ""),
                        true
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                });


                // DELETE BUTTON

                const remove = document.createElement("button");

                remove.textContent = "DELETE";
                remove.className = "danger";

                remove.addEventListener("click", async () => {

                    if (!confirm("Are you sure you want to delete this product?")) {
                        return;
                    }

                    try {

                        await deleteDoc(doc(db, "products", item.id));

                        showMessage("Product deleted successfully!", true);

                        await loadProducts();

                    } catch (error) {

                        showMessage("Delete failed. Check Firebase permissions.");

                    }

                });

                card.append(edit, remove);

                productList.appendChild(card);

            });

        } catch (error) {

            productList.textContent =
                "Could not load products. Please check Firebase settings and permissions.";

        }

    }


    // ADD OR UPDATE PRODUCT

    saveBtn.addEventListener("click", async () => {

        const name = productName.value.trim();
        const priceValue = productPrice.value.trim();
        const price = Number(priceValue);
        const category = productCategory.value;
        const image = productImage.value.trim();


        // VALIDATION

        if (!name) {
            showMessage("Please enter product name.");
            return;
        }

        if (!priceValue || !Number.isFinite(price) || price <= 0) {
            showMessage("Please enter a valid product price.");
            return;
        }

        if (category !== "men" && category !== "women") {
            showMessage("Please select a collection.");
            return;
        }

        if (image && !/^https?:\/\//i.test(image)) {
            showMessage("Please enter a valid image URL.");
            return;
        }


        const data = {
            name: name,
            price: price,
            category: category,
            image: image
        };

        saveBtn.disabled = true;
        saveBtn.textContent = "PLEASE WAIT...";

        try {

            if (editingId) {

                await updateDoc(
                    doc(db, "products", editingId),
                    data
                );

                showMessage("Product updated successfully!", true);

            } else {

                await addDoc(
                    collection(db, "products"),
                    data
                );

                showMessage("Product added successfully!", true);

            }

            clearForm();

            await loadProducts();

        } catch (error) {

            showMessage("Save failed. Check Firebase permissions.");

        } finally {

            saveBtn.disabled = false;

            saveBtn.textContent = editingId
                ? "UPDATE PRODUCT"
                : "ADD PRODUCT";

        }

    });


    // CLEAR FORM

    function clearForm() {

        productName.value = "";
        productPrice.value = "";
        productCategory.value = "";
        productImage.value = "";

        imagePreview.removeAttribute("src");
        imagePreview.style.display = "none";

        saveBtn.textContent = "ADD PRODUCT";

        cancelBtn.style.display = "none";

        editingId = null;

    }


    // CANCEL EDIT

    cancelBtn.addEventListener("click", () => {

        clearForm();
        showMessage("Edit cancelled.", true);

    });


    // LOGOUT

    document.getElementById("logoutBtn").addEventListener("click", async () => {

        try {

            await signOut(auth);

            showMessage("Logged out successfully.", true);

        } catch (error) {

            showMessage("Logout failed. Please try again.");

        }

    });

</script>

</body>
</html>
