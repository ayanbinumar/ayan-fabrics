
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collections | AYAN BIN UMAR</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #071b14;
            color: #e8d5a5;
            font-family: Georgia, serif;
            margin: 0;
        }

        .collections-page {
            min-height: 100vh;
            padding: 60px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .collections-page h1 {
            font-family: Cinzel, Georgia, serif;
            font-size: 34px;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .collections-page p {
            color: #d5c6a0;
            margin-bottom: 45px;
        }

        .collection-options {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 850px;
            margin: auto;
        }

        .collection-option {
            border: 1px solid #b99a55;
            padding: 55px 25px;
            width: 280px;
            box-sizing: border-box;
            text-decoration: none;
            color: #e8d5a5;
            transition: 0.3s;
        }

        .collection-option:hover {
            background: #b99a55;
            color: #071b14;
        }

        .collection-option h2 {
            font-size: 21px;
            letter-spacing: 2px;
        }

        .back-home {
            display: inline-block;
            margin-top: 45px;
            color: #e8d5a5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="collections-page">

        <h1>COLLECTIONS</h1>
        <p>Explore Our Exclusive Collections</p>

        <div class="collection-options">

            <a href="mens-collection.html"
               class="collection-option">
                <h2>MEN'S COLLECTION</h2>
            </a>

            <a href="womens-collection.html"
               class="collection-option">
                <h2>WOMEN'S COLLECTION</h2>
            </a>

        </div>

        <a href="index.html" class="back-home">
            ← BACK TO HOME
        </a>

    </main>

</body>
</html>
